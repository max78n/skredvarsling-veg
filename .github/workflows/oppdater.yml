# Bygger Værpakke og morgenbrief og publiserer sida på GitHub Pages.
# GitHub bruker UTC og kan forsinke eller hoppe over planlagte kjøringer. Derfor:
# - Værpakke kjøres hver time (xx:23 UTC, 05:23–21:23 norsk vintertid).
# - Morgenbriefen prøves flere ganger (05:13–06:53 UTC). Første forsøk etter kl. 07:00 norsk tid
#   lager briefen; senere forsøk samme dag hoppes over (sjekkes mot sist_kjort.txt).
# - Utsendte skredvarsel hentes fra Gmail ved hver kjøring. I sendevinduet (10–13 UTC = 11–14 vintertid)
#   sjekkes det i tillegg hvert 15. min; sida bygges og publiseres bare hvis det har kommet nye varsel.
name: Oppdater data

on:
  schedule:
    - cron: '23 4-20 * * *'
    - cron: '13,33,53 5,6 * * *'
    - cron: '8,38,53 10-13 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oppdater
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      modus: ${{ steps.tid.outputs.modus }}
      ok: ${{ steps.videre.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Velg hva som skal kjøres
        id: tid
        run: |
          H=$(TZ=Europe/Oslo date +%H); I_DAG=$(TZ=Europe/Oslo date +%F)
          SIST=$(cut -c1-10 sist_kjort.txt 2>/dev/null || true)
          M=vaerpakke
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M=brief
          elif [ "${{ github.event.schedule }}" = "13,33,53 5,6 * * *" ]; then
            if [ "$H" -ge 7 ] && [ "$H" -le 9 ] && [ "$SIST" != "$I_DAG" ]; then M=brief; else M=hopp; fi
          elif [ "${{ github.event.schedule }}" = "8,38,53 10-13 * * *" ]; then M=varsler
          fi
          echo "Oslo $H, sist brief $SIST, modus $M"
          echo "modus=$M" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.tid.outputs.modus != 'hopp'
        with:
          python-version: '3.12'

      - name: Utsendte skredvarsel fra Gmail
        id: varsler
        if: steps.tid.outputs.modus != 'hopp'
        env:
          GMAIL_BRUKER: ${{ secrets.GMAIL_BRUKER }}
          GMAIL_APP_PASSORD: ${{ secrets.GMAIL_APP_PASSORD }}
          VARSEL_AVSENDER: ${{ secrets.VARSEL_AVSENDER }}
        run: |
          # 1) eldre varsel lagt i data/varsler_import/ (.html eller .eml) importeres og fjernes
          shopt -s nullglob; IMP=(data/varsler_import/*.html data/varsler_import/*.htm data/varsler_import/*.eml)
          if [ ${#IMP[@]} -gt 0 ]; then
            python3 kilde/varslinger/hent_varsler.py --ut site/varsler --fil "${IMP[@]}" || echo "::warning::Import feilet"
            git rm -q -r data/varsler_import || true
          fi
          # 2) nye varsel fra Gmail
          if [ -z "$GMAIL_BRUKER" ] || [ -z "$GMAIL_APP_PASSORD" ] || [ -z "$VARSEL_AVSENDER" ]; then
            echo "::notice::Gmail-hemmeligheter mangler – henter ikke fra Gmail"
          else
            python3 kilde/varslinger/hent_varsler.py --ut site/varsler || echo "::warning::Henting fra Gmail feilet"
          fi
          if git status --porcelain site/varsler/v data/varsler_import | grep -q .; then
            echo "ny=1" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A site/varsler data/varsler_import 2>/dev/null || git add -A site/varsler
            git commit -q -m "Nye utsendte skredvarsel"
            git pull --rebase -q origin main || true
            git push || true
          else
            echo "ny=0" >> $GITHUB_OUTPUT; git checkout -- site/varsler 2>/dev/null || true
          fi

      - name: Bygg videre?
        id: videre
        if: steps.tid.outputs.modus != 'hopp'
        run: |
          if [ "${{ steps.tid.outputs.modus }}" = "varsler" ] && [ "${{ steps.varsler.outputs.ny }}" != "1" ]; then echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi

      - name: Installer pakker
        if: steps.videre.outputs.ok == '1'
        run: pip install -q netCDF4 numpy pyproj pillow python-pptx openpyxl

      - name: Hendelsesbilder fra PowerPoint (hvis fila er lastet opp)
        if: steps.videre.outputs.ok == '1' && hashFiles('data/*.pptx') != ''
        run: |
          python3 kilde/skredbaner/hent_bilder.py data/*.pptx site/bilder/dim "data/Dimensjonerende skredstørrelser_stedsspesifikk skredvarsling.xlsx" || echo "::warning::Hendelsesbildene kunne ikke lages"

      - name: Værpakke
        if: steps.videre.outputs.ok == '1'
        working-directory: site
        env:
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
          SKREDAS_TOKEN: ${{ secrets.SKREDAS_TOKEN }}
          WYSSEN_KEY: ${{ secrets.WYSSEN_KEY }}
        run: |
          python3 ../kilde/vaerpakke/bygg.py ../kilde/vaerpakke/config.json ../kilde/vaerpakke/mal.html vaerpakke.html --json ../data.json
          rm -f kart_filer.txt

      - name: Morgenbrief
        if: steps.tid.outputs.modus == 'brief'
        run: python3 kilde/morgenbrief/lag_brief.py data.json kilde/morgenbrief/mal_brief.html site/morgenbrief.html

      - name: Lagre morgenbriefen i repoet (holder også de planlagte kjøringene aktive)
        if: steps.tid.outputs.modus == 'brief'
        run: |
          echo "$(TZ=Europe/Oslo date +%F) $(date -u +%H:%MZ) morgenbrief ok" > sist_kjort.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sist_kjort.txt site/morgenbrief.html
          git commit -m "Morgenbrief $(TZ=Europe/Oslo date +%F)" || true
          git pull --rebase -q origin main || true
          git push || true

      - uses: actions/configure-pages@v5
        if: steps.videre.outputs.ok == '1'

      - uses: actions/upload-pages-artifact@v3
        if: steps.videre.outputs.ok == '1'
        with:
          path: site

  publiser:
    needs: bygg
    if: needs.bygg.outputs.modus != 'hopp' && needs.bygg.outputs.ok == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
